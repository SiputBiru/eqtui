[package]
name = "eqtui"
version = "0.1.3"
description = "Terminal-native(TUI) audio effects processor for PipeWire"
authors = ["SiputBiru <radityamahatma23@gmail.com>"]
license = "GPL-2.0-only"
repository = "https://github.com/SiputBiru/eqtui"
readme = "README.md"
keywords = ["pipewire", "equalizer", "tui", "audio", "dsp"]
categories = ["multimedia::audio", "command-line-utilities"]
exclude = [
  ".cache",
  "examples/",
  ".tmp/",
  ".github/",
  ".docs/",
  "target/",
]
rust-version = "1.89.0"
edition = "2024"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }
dirs = "6"
eyre = { version = "0.6.14", features = ["track-caller"] }
libc = "0.2.189"
libspa-sys = "0.10.0"
pipewire = "0.10.0"
pipewire-sys = "0.10.0"
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm_0_29",
  "layout-cache",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-input = { version = "0.15.4", default-features = false, features = [
  "crossterm",
] }
uds = "0.4.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
uninlined_format_args.level = "allow"
trivially_copy_pass_by_ref.level = "deny"
items_after_statements = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
must_use_candidate = "allow"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
